body[data-lang="it"] { --accent: var(--acc-it); }

#swap { transition: transform .25s ease; }

ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.item {

.item .t { color: var(--muted); display: block; font-size: .95rem; }
.empty { color: var(--muted); padding: .5rem 0; }

button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--heather); outline-offset: 2px; }
footer { margin-top: 2.5rem; color: var(--muted); font-size: .85rem; }
@media (prefers-reduced-motion: reduce) { #swap { transition: none; } }
</style>

      ["Chodit kolem horké kaše.", "Stop faffin’ abaht and spit it out.", "Walking around the hot porridge (beating about the bush).", "Yorkshire doesn’t have this problem. Yorkshire says it to your face.", "talk proverb"],

    it: [

    us: [
      ["Hey y’all!", "Ey up, you lot!", "Hello everyone!", "Y’all and you lot: two nations fixing English’s missing plural “you”.", "hello greeting"],

  };

  // Phonetic respellings for the browser voice (no browser has a Yorkshire accent)
  const SAY = {

    "Put t’kettle on.": "Putt kettle on.", "Ah’m fair clemmed.": "Arm fair clemmd.", "Ah’m off t’pub.": "Arm off ter poob.",
    "It’s a bit nippy out.": "It's a bit nippy aht.", "It’s black over Bill’s mother’s.": "It's black ower Bill's muther's.",
    "It’s nobbut a bit o’ drizzle.": "It's nobbut a bit o drizzle.", "Ah’m reet mafted.": "Arm reet mafted.",
    "Tha what?": "Thah wot?", "Ee by gum!": "Ee by goom!", "Gi’ over!": "Gi ower!",
    "’Ear all, see all, say nowt.": "Ear all, see all, say nowt.",
    "If tha does owt for nowt, do it for thisen.": "If thah dooz owt fer nowt, doo it fer thi-sen.",
    "Shut t’door, were tha born in a barn?": "Shut door, wer thah born in a barn?",
    "Tha’s a reet mardy bum.": "Thah's a reet mardy boom.", "Where’s tha bin?": "Wear's thah bin?",
    "Get thisen ’ome.": "Get thi-sen ome.", "Ta-ra, love!": "Ta-rah, luv!", "So what is it?": "So wot is it?",
    "Get it down thi!": "Get it dahn thi!", "Where’s t’nearest boozer?": "Wear's ter nearest boozer?",
    "Ah couldn’t give a monkey’s.": "Ah cooden give a monkeys.", "It’s reet nithering out there.": "It's reet nithering aht theer.",
    "Ah’ve not two ha’pennies to rub together.": "Arve not two hay-p'nies ter roob tergether.",
    "Tha gets nowt for nowt.": "Thah gets nowt fer nowt.",
    "Them as digs ’oles fer others ends up in one thisen.": "Them as digs oles fer others ends oop in one thi-sen.",
    "Stop faffin’ abaht and spit it out.": "Stop faffin abaht an spit it aht.", "Ah’m reet fed up wi’ it.": "Arm reet fed oop wi it.",
    "No use mitherin’ now.": "No yuse mitherin nah.", "Bloody ’ell!": "Bluddy ell!", "Sling thi ’ook!": "Sling thi ook!",
    "That’s champion, that!": "That's champion, that!", "Ey up, ’ow do?": "Ay oop, ow doo?",
    "Ey up, love!": "Ay oop, luv!", "Good luck, owd lad!": "Good luck, owd lad!", "What a reet mess!": "Wot a reet mess!",
    "It costs a bloody fortune.": "It costs a bluddy fortune.", "Ah dunno, me.": "Ah dunno, mi.",
    "Ah’m champing at t’bit!": "Arm champin at ter bit!", "Nowt to do wi’ me.": "Nowt ter do wi mi.",

  };

  let lang = "cz";
  let reversed = false;
  let current = 0;
  const $ = (id) => document.getElementById(id);

  function data() {
    if (reversed) return REV[lang];
    return YK.map((r) => [r.y, r.t[lang], r.m, r.n[lang] || r.n._, r.tags]);
  }

  function feature(i) {
    current = i;
    const [from, to, meaning, note] = data()[i];
    $("fFrom").textContent = from;
    $("fTo").textContent = to;
    $("fMeaning").textContent = "Meaning: " + meaning;
    $("fNote").textContent = note;
    document.querySelectorAll(".item").forEach((el) => el.setAttribute("aria-current", String(+el.dataset.i === i)));
  }

  function renderList() {
    const q = $("search").value.trim().toLowerCase();
    const list = $("list");
    list.textContent = "";
    let shown = 0;
    data().forEach((row, i) => {
      if (q && !row.join(" ").toLowerCase().includes(q)) return;
      shown++;
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button"; b.className = "item"; b.dataset.i = i;
      b.setAttribute("aria-current", String(i === current));
      const f = document.createElement("span"); f.className = "f"; f.textContent = row[0];
      const t = document.createElement("span"); t.className = "t"; t.textContent = row[1];
      b.append(f, t);
      b.onclick = () => { feature(i); window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); };
      li.appendChild(b); list.appendChild(li);
    });
    if (!shown) {
      const li = document.createElement("li"); li.className = "empty";
      li.textContent = "Nowt found. Try another word.";
      list.appendChild(li);
    }
  }

  function random() {
    const n0 = data().length;
    let n; do { n = Math.floor(Math.random() * n0); } while (n === current && n0 > 1);
    feature(n);
  }

  function render() {
    const L = LANGS[lang];
    document.body.dataset.lang = lang;
    document.body.classList.toggle("reversed", reversed);
    document.querySelectorAll(".pick").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    $("hello").textContent = L.hello;
    $("fromLabel").textContent = reversed ? L.name : "Yorkshire";
    $("toLabel").textContent = reversed ? "Yorkshire" : L.name;
    $("fromLabel").className = "lang " + (reversed ? "tl" : "yk");
    $("toLabel").className = "lang " + (reversed ? "yk" : "tl");
    $("lede").textContent = (reversed ? L.rev : L.fwd) + " Pick a phrase, press play, and try not to start a diplomatic incident.";
    $("searchLabel").textContent = "Find a phrase (try “rain”, “food” or “pub”)";
    $("aiIn").placeholder = reversed ? "Type summat in " + L.english + "…" : "Type owt in Yorkshire…";
    $("search").value = "";
    $("aiOut").textContent = "";
    current = -1;
    renderList();
    random();
  }

  function setLang(l) {
    if (!LANGS[l]) return;
    lang = l;
    render();
  }

  document.querySelectorAll(".pick").forEach((b) => {
    b.onclick = () => { if (location.hash !== "#" + b.dataset.lang) location.hash = b.dataset.lang; else setLang(b.dataset.lang); };
  });
  window.addEventListener("hashchange", () => setLang(location.hash.slice(1)));
  $("swap").onclick = () => { reversed = !reversed; $("swap").classList.toggle("spun"); render(); };
  $("shuffle").onclick = random;
  $("search").addEventListener("input", renderList);

  // Speech. A Yorkshire line plays a recorded clip from audio/<slug>.mp3 if one exists,
  // otherwise the browser voice reads a phonetic respelling.
  const synth = window.speechSynthesis;
  const slug = (s) => s.toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  function pickVoice(prefix) {
    const vs = synth ? synth.getVoices() : [];
    return vs.find((v) => v.lang && v.lang.replace("_", "-").toLowerCase().startsWith(prefix));
  }
  function tts(text, speechLang, prefix) {
    return new Promise((resolve) => {
      if (!synth) return resolve();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = speechLang;
      const v = pickVoice(prefix);
      if (v) u.voice = v;
      if (speechLang === "en-GB") { u.rate = 0.9; u.pitch = 0.85; }
      u.onend = u.onerror = () => resolve();
      synth.speak(u);
    });
  }
  function sayYorkshire(text) {
    return new Promise((resolve) => {
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      const fallback = () => { if (done) return; done = true; tts(SAY[text] || text, "en-GB", "en-gb").then(resolve); };
      const a = new Audio("audio/" + slug(text) + ".mp3");
      a.onended = finish;
      a.onerror = fallback;
      a.play().catch(fallback);
    });
  }
  let speaking = false;
  $("speak").onclick = async () => {
    if (speaking || current < 0) return;
    speaking = true;
    if (synth) synth.cancel();
    const L = LANGS[lang];
    const row = data()[current];
    const yk = reversed ? row[1] : row[0];
    const other = (reversed ? row[0] : row[1]).split(" / ")[0];
    try {
      if (reversed) { await tts(other, L.speech, L.voice); await sayYorkshire(yk); }
      else { await sayYorkshire(yk); await tts(other, L.speech, L.voice); }
    } finally { speaking = false; }
  };

  setLang(LANGS[location.hash.slice(1)] ? location.hash.slice(1) : "cz");

  // Free-text translation: only when the page is opened inside Claude
  (async () => {
    let sample = null;
    try { if (window.claude && typeof window.claude.use === "function") sample = await window.claude.use("sample"); } catch { sample = null; }
    if (!sample) return;
    $("aiLink").hidden = true;
    $("ai").hidden = false;
    const go = async () => {
      const text = $("aiIn").value.trim();
      const out = $("aiOut");
      if (!text) { out.textContent = "Tha’s not typed owt yet."; return; }
      const L = LANGS[lang];
      $("aiGo").disabled = true; out.textContent = "Brewing a translation…";
      const target = lang === "us" ? "everyday American English (US spelling and US slang)" : "natural everyday " + L.english;
      const dir = reversed
        ? "from " + (lang === "us" ? "American English" : L.english) + " into broad Yorkshire dialect English (tha, t’, nowt, summat, owt, aye, love)."
        : "from Yorkshire dialect English into " + target + ". First work out what the Yorkshire really means (dialect words, idioms, sarcasm), and use a native idiom where one fits better than a literal translation.";
      try {
        const res = await sample.json(
          "Translate the text below " + dir + " Keep the meaning faithful and don't add rudeness that wasn't there. " +
          "Also give one short, funny translator's note in English (max 30 words, dry Yorkshire voice). " +
          'Reply ONLY with JSON: {"translation":"...","note":"..."}\n\nText:\n' + text,
          { modelTier: "quick" }
        );
        out.textContent = res && res.translation ? String(res.translation) : "Came back wi’ nowt. Try rewording it.";
        if (res && res.note) {
          const n = document.createElement("span"); n.className = "note"; n.textContent = String(res.note);
          out.appendChild(n);
        }
      } catch (e) {
        out.textContent = e && e.code === "not_granted"
          ? "Free-text translation needs permission to use Claude. The phrasebook below still works."
          : e && e.code === "rate_limited" ? "Steady on — too many at once. Give it a minute."
          : "That didn’t work. The phrasebook below still works fine.";
      } finally { $("aiGo").disabled = false; }
    };
    $("aiGo").onclick = go;
    $("aiIn").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); go(); } });
  })();
})();
